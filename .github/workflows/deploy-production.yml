name: Deploy to Production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment in GitHub
    # (Settings > Environments > production) to gate each deploy.
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/sowhatpodcast/wp-content/themes/so_what_podcast/
          protocol: ftps
          # dry-run: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            README.md
            package.json
            package-lock.json
            .eslintrc
            .stylelintrc.json
            phpcs.xml.dist
            composer.*
